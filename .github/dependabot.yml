version: 2

updates:
  # ────────────────────────────────────────────────────────────────────
  # bun ecosystem -- `bun.lock` is its own package-ecosystem value
  # (>=v1.1.39), separate from `npm`. See:
  # https://docs.github.com/en/code-security/reference/supply-chain-security/supported-ecosystems-and-repositories#bun
  # ────────────────────────────────────────────────────────────────────
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - area/root
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      root-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: bun
    directory: /common-ts
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 8
    labels:
      - dependencies
      - area/common-ts
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      common-ts-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: bun
    directory: /react
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 8
    labels:
      - dependencies
      - area/react
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      react-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: bun
    directory: /icons
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - area/icons
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      icons-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: bun
    directory: /posthog-types
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - area/posthog-types
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      posthog-types-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # ────────────────────────────────────────────────────────────────────
  # GitHub Actions — keep SHA-pinned actions current with their tags
  # ────────────────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - area/ci
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      # semver-major-days/semver-minor-days are rejected for github-actions --
      # Dependabot doesn't treat action tags as SemVer for cooldown purposes.
      default-days: 7
    groups:
      gha-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
