name: npm audit signatures

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  audit-signatures:
    name: audit signatures (${{ matrix.directory }})
    runs-on: ubicloud
    timeout-minutes: 10
    # Non-blocking to start: flip this once the baseline below is clean.
    # An immediately-red check gets ignored, which is worse than no check.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        directory: [., common-ts, icons, posthog-types, react]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.x.x'

      - name: Resolve dependency tree with npm
        # bun.lock has no npm/yarn equivalent lockfile checked in, and bun/yarn
        # do not implement `audit signatures`, so resolve a tree with npm here
        # purely to verify registry signatures and provenance attestations.
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify registry signatures and provenance
        run: npm audit signatures
