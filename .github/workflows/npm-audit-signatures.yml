name: npm audit signatures

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  audit-signatures:
    name: audit signatures (${{ matrix.directory }})
    runs-on: ubicloud
    timeout-minutes: 10
    # Non-blocking to start: flip this once the baseline below is clean.
    # An immediately-red check gets ignored, which is worse than no check.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        directory: [., common-ts, icons, posthog-types, react]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.x.x'

      - name: Resolve dependency tree with npm
        # bun.lock has no npm/yarn equivalent lockfile checked in, and bun/yarn
        # do not implement `audit signatures`, so resolve a tree with npm here
        # purely to verify registry signatures and provenance attestations.
        # `npm audit signatures` reads installed node_modules, not just a
        # lockfile, so this needs a real install rather than --package-lock-only.
        id: install
        continue-on-error: true
        run: |
          set +e
          npm install --ignore-scripts 2> /tmp/npm-install.stderr
          ec=$?
          cat /tmp/npm-install.stderr >&2
          exit $ec

      - name: Handle the known react/ override conflict
        # react/package.json has @types/react: npm:types-react@19.0.0-rc.1 as a
        # direct devDependency while overrides/resolutions pin it to 19.0.3.
        # bun resolves that fine; npm refuses with EOVERRIDE. Pre-existing,
        # not introduced here. Rather than leave this matrix cell permanently
        # red (which trains reviewers to ignore it), treat *this specific*
        # known conflict as an explicit, annotated skip -- any other install
        # failure in react/ still fails the job loudly.
        if: matrix.directory == 'react' && steps.install.outcome == 'failure'
        run: |
          if grep -q 'EOVERRIDE' /tmp/npm-install.stderr && grep -q '@types/react' /tmp/npm-install.stderr; then
            echo "::notice::react/ skipped -- known EOVERRIDE conflict between the @types/react devDependency and the overrides pin (bun tolerates it, npm doesn't). Signatures are not verified for this directory until package.json is reconciled."
          else
            echo "::error::npm install failed in react/ for a reason other than the known EOVERRIDE conflict -- investigate."
            exit 1
          fi

      - name: Fail on unresolved install error
        if: matrix.directory != 'react' && steps.install.outcome == 'failure'
        run: exit 1

      - name: Verify registry signatures and provenance
        if: steps.install.outcome == 'success'
        run: npm audit signatures
